name: CI

on:
  push:
    branches: [dev, staging, prod]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check dummy_plugin.py tests

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q tests/unit

  package:
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests ]
    steps:
      - uses: actions/checkout@v4

      - name: Show repo layout
        run: |
          pwd
          ls -la
          echo "---- metadata.txt ----"
          sed -n '1,80p' metadata.txt || true
          echo "---- pyproject.toml ----"
          sed -n '1,120p' pyproject.toml || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packager
        run: pip install -U qgis-plugin-ci

      - name: Package
        run: |
          set -euxo pipefail
          qgis-plugin-ci package latest

          # Rename dot-prefixed zips to normal names for artifact upload
          for f in ..*.zip; do
            [ -e "$f" ] || continue
            mv "$f" "dummy_plugin_${f#..}"
          done

          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: qgis-plugin-zip
          path: "*.zip"
          if-no-files-found: error