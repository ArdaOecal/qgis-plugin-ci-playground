name: CI

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q tests/unit

  package:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install qgis-plugin-ci
      - name: Package (allow uncommitted not needed in CI)
        run: qgis-plugin-ci package latest
      - uses: actions/upload-artifact@v4
        with:
          name: qgis-plugin-zip
          path: "*.zip"